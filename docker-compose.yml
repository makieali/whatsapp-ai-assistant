services:
  whatsapp-ai:
    build: .
    ports:
      - "5060:5060"
    env_file:
      - .env
    environment:
      - FLASK_DEBUG=false
      # Use the Postgres service below by default (override in .env if needed).
      - DATABASE_URL=postgresql://whatsbot:whatsbot@db:5432/whatsbot
    depends_on:
      - db

  # Postgres for shared, persistent conversation history (users/conversations/messages).
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=whatsbot
      - POSTGRES_PASSWORD=whatsbot
      - POSTGRES_DB=whatsbot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
