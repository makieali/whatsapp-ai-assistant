name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: whatsbot
          POSTGRES_PASSWORD: whatsbot
          POSTGRES_DB: whatsbot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://whatsbot:whatsbot@localhost:5432/whatsbot_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify Alembic migrations apply to Postgres
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql://whatsbot:whatsbot@localhost:5432/whatsbot_test

      - name: Run tests (incl. Postgres path)
        run: pytest -q
